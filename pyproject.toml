[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-canvas"
version = "0.1.0"
description = "Data Product Development - Campaign Canvas Analytics Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.35.0",
    "plotly>=5.15.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "sqlglot>=20.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
executionEnvironments = [
    { root = "." }
]

